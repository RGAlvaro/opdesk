name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opdesk
          POSTGRES_PASSWORD: opdesk_dev_password
          POSTGRES_DB: opdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opdesk -d opdesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.3.3

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run full verification
        env:
          LOCAL_DATABASE_URL: postgresql+psycopg://opdesk:opdesk_dev_password@localhost:5432/opdesk
        run: make verify

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Validate production Compose config
        run: make prod-config

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_OUTPUT_DIR: /work/test-results
        run: make test-e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
